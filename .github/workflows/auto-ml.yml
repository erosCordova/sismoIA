name: SISMOIA - Entrenamiento ML gratuito

on:
  schedule:
    - cron: "19 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sismoia-auto-ml
  cancel-in-progress: false

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Verificar configuracion segura
        id: config
        env:
          DATABASE_URL: ${{ secrets.SISMOIA_DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "ENTRENAMIENTO=ESPERANDO_CONFIGURACION"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "CONFIGURACION=DISPONIBLE"
          fi

      - name: Preparar Python
        if: steps.config.outputs.configurado == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        if: steps.config.outputs.configurado == 'true'
        run: |
          python -m pip install \
            -r services/api/requirements.txt

      - name: Preparar datos y entrenar
        if: steps.config.outputs.configurado == 'true'
        working-directory: services/api
        env:
          DATABASE_URL: ${{ secrets.SISMOIA_DATABASE_URL }}
          SISMOIA_AUTO_ML_ENABLED: "true"
        run: |
          python -c 'import os,secrets,runpy; os.environ["JWT_SECRET_KEY"]=secrets.token_urlsafe(64); runpy.run_path("run_auto_ml.py",run_name="__main__")'
