name: SISMOIA - Respaldo PostgreSQL

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

concurrency:
  group: sismoia-postgres-backup
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SISMOIA_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.SISMOIA_BACKUP_PASSPHRASE }}

    steps:
      - name: Validar secretos
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "ERROR=FALTAN_SECRETOS_DE_RESPALDO"
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 24 ]; then
            echo "ERROR=CLAVE_DE_RESPALDO_DEMASIADO_CORTA"
            exit 1
          fi

      - name: Crear y comprobar copia logica
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sismoia-tmp"

          docker run --rm \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/sismoia-tmp:/backup" \
            postgres:18 \
            sh -ec '
              pg_dump \
                --format=custom \
                --no-owner \
                --no-acl \
                --dbname="$DATABASE_URL" \
                --file=/backup/database.dump

              pg_restore \
                --list /backup/database.dump \
                > /backup/manifest.txt
            '

          test -s "$RUNNER_TEMP/sismoia-tmp/database.dump"
          test -s "$RUNNER_TEMP/sismoia-tmp/manifest.txt"

          echo "RESPALDO_LOGICO=OK"

      - name: Cifrar y verificar respaldo
        shell: bash
        run: |
          set -euo pipefail

          ORIGEN="$RUNNER_TEMP/sismoia-tmp/database.dump"
          DESTINO="$RUNNER_TEMP/sismoia-backup.dump.gpg"
          VERIFICACION="$RUNNER_TEMP/sismoia-tmp/verificacion.dump"

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 3 \
            --symmetric \
            --cipher-algo AES256 \
            --output "$DESTINO" \
            "$ORIGEN" \
            3<<<"$BACKUP_PASSPHRASE"

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 3 \
            --decrypt \
            --output "$VERIFICACION" \
            "$DESTINO" \
            3<<<"$BACKUP_PASSPHRASE"

          cmp "$ORIGEN" "$VERIFICACION"

          rm -f "$ORIGEN" "$VERIFICACION"

          echo "CIFRADO_AES256=OK"
          echo "VERIFICACION_DE_COPIA=OK"

      - name: Guardar respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: sismoia-postgresql-${{ github.run_id }}
          path: ${{ runner.temp }}/sismoia-backup.dump.gpg
          retention-days: 14
          if-no-files-found: error

      - name: Limpiar archivos temporales
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/sismoia-tmp"
          rm -f "$RUNNER_TEMP/sismoia-backup.dump.gpg"
