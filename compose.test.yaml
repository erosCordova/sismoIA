services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sismoia_test
      POSTGRES_USER: sismoia_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismoia_test -d sismoia_test"]
      interval: 3s
      timeout: 3s
      retries: 15
