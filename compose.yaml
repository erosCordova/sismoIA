services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sismoia
      POSTGRES_USER: sismoia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sismoia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismoia -d sismoia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sismoia_pgdata:
